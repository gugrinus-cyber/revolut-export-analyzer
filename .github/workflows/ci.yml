name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m py_compile revolut_analyzer.py
      - name: Run sample analysis
        run: python revolut_analyzer.py tests/sample.csv --output /tmp/revolut_report.md
      - name: Check report
        run: grep -q "Totals by currency" /tmp/revolut_report.md
